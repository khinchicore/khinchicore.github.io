        .btn-business { background: #10b981; }
        .btn-insta { background: #e1306c; }
        .btn-fb { background: #1877f2; }
        .btn-threads { background: #000; border: 1px solid #334155; }
        .btn-tg { background: #0088cc; }
        .btn-yt { background: #ff0000; }
        .btn-x { background: #1da1f2; }
